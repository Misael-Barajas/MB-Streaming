name: Deploy to mb-streaming.github.io

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to external repo (mb-streaming.github.io)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: mb-streaming/mb-streaming.github.io
          publish_branch: main
          publish_dir: ./
          force_orphan: true
